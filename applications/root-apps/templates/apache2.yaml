apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apache2
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: apache
    targetRevision: 11.4.28
    helm:
      values: |
        service:
          type: NodePort
        image:
          repository: bitnamilegacy/apache
        global:
          security:
            allowInsecureImages: true
  destination:
    server: https://kubernetes.default.svc
    namespace: apache2
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true        
