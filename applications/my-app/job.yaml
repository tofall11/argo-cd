apiVersion: batch/v1
kind: Job
metadata:
  name: myjob
  annotations:
    argocd.argoproj.io/hook: PreSync  
    argocd.argoproj.io/hook-delete-policy: HookFailed
spec:
  template:
    metadata: {}
    spec:
      containers:
      - command:
        - sh
        - -c
        - echo
        - Hey
        image: busybox
        name: myjob
        resources: {}
      restartPolicy: Never
status: {}
